kind = "mobile"
previewPath = "/"
title = "MilGaya"
version = "1.0.0"
id = "artifacts/milgaya"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21796

[services.development]
run = "pnpm --filter @workspace/milgaya run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/milgaya", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/milgaya", "run", "serve" ]

[services.env]
PORT = "21796"
BASE_PATH = "/"
